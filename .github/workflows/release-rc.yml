name: Release RC

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write
  id-token: write   # for npm provenance
  packages: write

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  smoke:
    name: Smoke (install tarball + run)
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack --json | tee pack.json
      - name: Install tarball globally
        shell: bash
        run: |
          TARBALL=$(node -p "require('./pack.json')[0].filename" 2>/dev/null || ls evolutionary-cli-wrapper-*.tgz)
          npm install -g "./$TARBALL"
      - name: Smoke — evo --version
        run: evo --version
      - name: Smoke — evo doctor --json
        shell: bash
        run: |
          evo doctor --json | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const j = JSON.parse(d);
              if (!j.versions) throw new Error('doctor JSON missing versions');
              console.log('doctor JSON OK');
            });
          "

  publish:
    name: Publish to npm (next channel)
    needs: smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish
        run: npm publish --tag next --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release (prerelease)
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Extract notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VER='${{ steps.ver.outputs.version }}'
          # Match "## v<VER>" optionally followed by whitespace + anything (e.g. a date).
          # Anchor with [[:space:]]|$ so v3.4.4 does NOT match v3.4.40.
          # ([[:space:]] is POSIX — gawk does not honor \s; \s would silently
          # collapse to plain "s" and break the match.)
          # Exit on the next "## v" OR "## Unreleased" boundary.
          # Hard-fail if no section is found — no silent fallback to Unreleased.
          # The whole point of this workflow is to refuse releasing with wrong notes.
          awk -v ver_anchor="^## v${VER}([[:space:]]|$)" '
            $0 ~ ver_anchor { flag=1; next }
            flag && /^## (v|Unreleased)/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG section found for v${VER}. Update CHANGELOG.md (add '## v${VER} (YYYY-MM-DD)' heading) before pushing the RC tag."
            exit 1
          fi
          echo "Notes file:" && head -20 /tmp/release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }} (RC)" \
            --notes-file /tmp/release-notes.md \
            --prerelease
