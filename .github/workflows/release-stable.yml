name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without "v" prefix, e.g. 3.6.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-stable-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (verify tag does not exist)
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.s.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: s
        run: echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Reject if tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}"; then
            echo "Tag v${{ inputs.version }} already exists — refusing to overwrite." >&2
            exit 1
          fi
      - name: Reject if version mismatches package.json
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$PKG_VER" != "${{ inputs.version }}" ]; then
            echo "package.json says $PKG_VER, but you requested ${{ inputs.version }}. Bump package.json first." >&2
            exit 1
          fi

  build-test:
    name: Build + test
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        node: [22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  smoke:
    name: Smoke
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack --json | tee pack.json
      - name: Install tarball globally and smoke test
        shell: bash
        run: |
          TARBALL=$(node -p "require('./pack.json')[0].filename" 2>/dev/null || ls evolutionary-cli-wrapper-*.tgz)
          npm install -g "./$TARBALL"
          evo --version
          evo doctor --json | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const j = JSON.parse(d);
              if (!j.versions) throw new Error('doctor JSON missing versions');
              console.log('doctor JSON OK');
            });
          "

  tag-and-publish:
    name: Tag, publish, release
    needs: smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - name: Publish to npm (latest)
        run: npm publish --tag latest --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Extract notes from CHANGELOG
        run: |
          VER='${{ inputs.version }}'
          # Match "## v<VER>" optionally followed by whitespace + anything (e.g. a date).
          # Anchor with [[:space:]]|$ so v3.4.4 does NOT match v3.4.40.
          # ([[:space:]] is POSIX — gawk does not honor \s; \s would silently
          # collapse to plain "s" and break the match.)
          # Exit on the next "## v" OR "## Unreleased" boundary.
          # Hard-fail if no section is found — for the stable channel especially,
          # we refuse to publish without proper notes.
          awk -v ver_anchor="^## v${VER}([[:space:]]|$)" '
            $0 ~ ver_anchor { flag=1; next }
            flag && /^## (v|Unreleased)/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG section found for v${VER}. Update CHANGELOG.md before re-running the workflow."
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest
